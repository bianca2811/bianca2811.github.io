<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bianca Orihuela | Portafolio Técnico</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117;

            margin: 0; 
            padding: 40px; 
            text-align: center; 
        }
        .container { 
            background-color: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            display: inline-block; 
            max-width: 600px; 
            margin-top: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        h3 { color: #8b949e; font-weight: 400; margin-top: 0; }
        p { line-height: 1.6; color: #8b949e; }
        .btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background-color: #238636; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2ea44f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola! Soy Bianca Orihuela 🫶</h1>
